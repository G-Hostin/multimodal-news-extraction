[server]
# Le tableau de bord n'est accessible que depuis cette machine
address = "localhost"

[browser]
gatherUsageStats = false

[logger]
# Pas de message d'accueil ni de suggestions de Streamlit
hideWelcomeMessage = true

[client]
# Cache le bouton "Deploy" et le menu développeur
toolbarMode = "viewer"

[theme]
base = "light"
# Bleu des graphiques, pour ne pas confondre la couleur des boutons avec le rouge des erreurs
primaryColor = "#0068c9"
